version: '3.8'

services:
  # PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enterprise_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_ai_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_ai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:enterprise_password_123@postgres:5432/enterprise_ai
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-1.5-flash
      - GEMINI_EMBEDDING_MODEL=models/text-embedding-004
      - SECRET_KEY=${SECRET_KEY:-enterprise-secret-key-change-in-production-1234567890}
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/data/uploads

  # React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_ai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  qdrant_data:
  backend_uploads:
