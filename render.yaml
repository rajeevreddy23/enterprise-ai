services:
  # Backend Service on Render
  - type: web
    name: enterprise-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-ai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

databases:
  # Managed PostgreSQL on Render
  - name: enterprise-ai-db
    databaseName: enterprise_ai
    user: enterprise_user
    plan: starter
